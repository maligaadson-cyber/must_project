
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Project Registration | PTMS</title>


    <style>

        /* =========================
           GENERAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7f6;
            color: #333;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            background: #ffffff;
            min-height: 85px;
            padding: 12px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
        }


        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .logo-area img {
            width: 58px;
            height: 58px;
            object-fit: contain;
        }


        .logo-area h2 {
            color: #006b3c;
            font-size: 25px;
            margin-bottom: 3px;
        }


        .logo-area span {
            font-size: 12px;
            color: #666;
        }


        /* =========================
           NAVIGATION
        ========================= */

        .navbar {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }


        .navbar a {
            text-decoration: none;
            color: #333;
            padding: 9px 12px;
            font-size: 14px;
            border-radius: 4px;
            transition: 0.3s;
        }


        .navbar a:hover {
            background: #e9f5ef;
            color: #006b3c;
        }


        .navbar a.active {
            background: #006b3c;
            color: #ffffff;
        }


        .navbar .login-btn {
            background: #174a7c;
            color: white;
            margin-left: 5px;
        }


        .navbar .login-btn:hover {
            background: #123b63;
            color: white;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .page-container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }


        .page-title {
            text-align: center;
            margin-bottom: 30px;
        }


        .page-title h1 {
            color: #006b3c;
            font-size: 30px;
            margin-bottom: 8px;
        }


        .page-title p {
            color: #666;
            font-size: 15px;
        }


        /* =========================
           FORM CARD
        ========================= */

        .form-card {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            margin: auto;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
        }


        .form-card form {
            display: flex;
            flex-direction: column;
        }


        .form-card label {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 7px;
            color: #333;
        }


        .form-card input,
        .form-card select {
            width: 100%;
            height: 45px;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 20px;
            background: #fff;
            outline: none;
        }


        .form-card input:focus,
        .form-card select:focus {
            border-color: #006b3c;
            box-shadow: 0 0 0 2px rgba(0, 107, 60, 0.08);
        }


        .form-card input::placeholder {
            color: #999;
        }


        /* =========================
           BUTTON
        ========================= */

        .btn {
            border: none;
            border-radius: 5px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }


        .primary-btn {
            background: #006b3c;
            color: #ffffff;
            margin-top: 5px;
        }


        .primary-btn:hover {
            background: #00532f;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #006b3c;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 50px;
            font-size: 13px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 850px) {

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }


            .navbar {
                justify-content: center;
            }

        }


        @media (max-width: 600px) {

            .page-container {
                width: 94%;
                margin: 25px auto;
            }


            .form-card {
                padding: 20px;
            }


            .page-title h1 {
                font-size: 25px;
            }


            .navbar a {
                font-size: 12px;
                padding: 7px 8px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">


    <div class="logo-area">

        <img src="must-logo.png"
             alt="MUST Logo">


        <div>

            <h2>PTMS</h2>

            <span>
                MUST Project Title Management System
            </span>

        </div>

    </div>



    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav class="navbar">

        <a href="index.html">
            Home
        </a>


        <a href="registration.html"
           class="active">
            Registration
        </a>


        <a href="titles.html">
            Project Titles
        </a>


        <a href="supervisor.html">
            Supervisors
        </a>


        <a href="project.html">
            Projects
        </a>


        <a href="about.html">
            About
        </a>


        <a href="contact.html">
            Contact
        </a>


        <a href="login.html"
           class="login-btn">
            Login
        </a>

    </nav>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="page-container">


    <div class="page-title">

        <h1>
            Project Registration
        </h1>

        <p>
            Register your project title for administrator approval.
        </p>

    </div>



    <!-- =========================
         REGISTRATION FORM
    ========================= -->

    <div class="form-card">


        <form id="registrationForm">


            <!-- FULL NAME -->

            <label for="studentName">
                Student Full Name
            </label>

            <input
                type="text"
                id="studentName"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >



            <!-- REGISTRATION NUMBER -->

            <label for="regNumber">
                Registration Number
            </label>

            <input
                type="text"
                id="regNumber"
                placeholder="Example: BCS/2023/001"
                required
            >



            <!-- PROJECT TITLE -->

            <label for="title">
                Project Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Enter your proposed project title"
                required
            >



            <!-- SUPERVISOR -->

            <label for="supervisor">
                Supervisor
            </label>

            <select id="supervisor"
                    required>

                <option value="">
                    -- Select Supervisor --
                </option>

                <option value="Dr. John Doe">
                    Dr. John Doe
                </option>

                <option value="Dr. Jane Smith">
                    Dr. Jane Smith
                </option>

                <option value="Prof. James Peter">
                    Prof. James Peter
                </option>

            </select>



            <!-- SUBMIT -->

            <button
                type="submit"
                class="btn primary-btn">

                Register Project

            </button>


        </form>


    </div>


</main>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        © 2026 Project Title Management System - MUST
    </p>

</footer>



<!-- =========================
     JAVASCRIPT
========================= -->

<script src="script.js"></script>


</body>

</html>
